name: IrSO Functional Tests

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize, ready_for_review ]

permissions: {}

jobs:
  test:
    runs-on: oracle-vm-4cpu-16gb-x86-64
    strategy:
      fail-fast: false
      matrix:
        include:
        - centos_version: stream9
          base_image: quay.io/centos/centos:stream9-minimal
          image: localhost/ironic:irso-stream9
        - centos_version: stream10
          base_image: quay.io/centos/centos:stream10-minimal
          image: localhost/ironic:irso-stream10
    permissions:
      checks: write
      contents: read
    env:
      CLUSTER_TYPE: minikube
      CONTAINER_RUNTIME: docker
      LOGDIR: /tmp/logs
      JUNIT_OUTPUT: /tmp/logs/report.xml
      IRONIC_CUSTOM_IMAGE: ${{ matrix.image }}
      IRONIC_BASE_IMAGE: ${{ matrix.base_image }}
      # NOTE(dtantsur): change this on stable branches to make sure the correct
      # logic is used in IrSO, and also that the tests are skipped properly.
      IRONIC_CUSTOM_VERSION: latest
    steps:
    - name: Check docker version
      run: docker --version
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ironic-image
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: metal3-io/ironic-standalone-operator
        path: ironic-standalone-operator
        persist-credentials: false
    - name: Calculate go version
      id: vars
      run: echo "go_version=$(make -sC ironic-standalone-operator go-version)" >> $GITHUB_OUTPUT
    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version: ${{ steps.vars.outputs.go_version }}
    - name: Setup a minikube cluster
      uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
      with:
        start-args: "--ha"
    - name: Prepare tests
      run: ironic-standalone-operator/test/prepare.sh
    - name: Build and local the image
      run: ironic-image/hack/prepare-irso-tests.sh
    - name: Run tests
      run: ironic-standalone-operator/test/run.sh
    - name: Collect logs
      run: ironic-standalone-operator/test/collect-logs.sh
      if: always()
    - name: Upload logs artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: functional-${{ matrix.centos_version }}
        path: /tmp/logs/*
      if: always()
    - name: Annotate failures
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
      with:
        annotate_only: true
        report_paths: /tmp/logs/report.xml
      if: always()
